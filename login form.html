<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="login form .css">

<style>
    *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
.container{
   
    background-image:url(coool.png);
    background-position: center;
    background-size: cover;
    padding: 0 5%;
    position: relative;
overflow: hidden;
}
.logo{
    width: 160px;
    cursor: pointer;
    animation: movedown 1s linear 1;
    animation-delay: 1s;
    visibility: hidden;
    animation-fill-mode: forwards;
}
@keyframes movedown {
    0%{
        transform: translateY(-100px);
        visibility: visible;

    }
    100%{
        transform: translateY(0px);
        visibility: visible;

    }
}
.navbar{
    width: 100%;
    height: 15vh;
    margin: auto;
    display: flex;
    align-items: center;
}
.cart{
    width: 40px;
    cursor: pointer;
    animation: movedown 1s linear 1;
    animation-delay: 3s;
    visibility: hidden;
    animation-fill-mode: forwards;
} 
nav{
    flex: 1;
    padding-left: 60px;
    animation: movedown 1s linear 1;
    animation-delay: 2s;
    visibility: hidden;
    animation-fill-mode: forwards;
}
nav ul li{
    display: inline-block;
    list-style: none;
    margin: 0px 20px;
}
nav ul li a{
    text-decoration: none;
    color: white;
}
nav ul li a:hover{
    color:purple;
      
}

    body{
    height: 100vh;
    width: 100%;
    background-image:url(coool.png);
    }
h1{
    color: rgb(0, 0, 255);
    background-color: gold;
text-align: center;
}
h2{
    color: rgb(20, 19, 19);
    text-align: center;
    background-color: gold;
}
li{
    color: white;
}
</style></head>
<body>
    <div class="container">
        <div class="navbar">
            <img class="logo" src="logo3-removebg-preview.png" alt="loji">
            <nav>
                <ul>
                    <li><a href="wintercollection.html">Home</a></li>
                    <li><a href="contact.html">About</a></li>
                    <li><a href="COLLECTION.HTML">Collection</a></li>
                    <li><a href="login form.html">login</a></li>
                </ul>
            </nav>
            <img class="cart" src="cart2-removebg-preview.png" alt="cart">
        </div>
    <h1><h1><b>*WINTER Collection*</b></h1></h1><br>

  <form class="modal-content animate" action="/action_page.php" method="post">
    <div class="imgcontainer">
      <span onclick="document.getElementById('id01').style.display='none'" class="close" title="Close Modal">&times;</span>
      <img src="logo3.png" alt="Avatar" class="avatar">
    </div>

    <div class="container">
      <label for="uname"><b>Username</b></label>
      <input type="text" placeholder="Enter Username" name="uname" required>

      <label for="psw"><b>Password</b></label>
      <input type="password" placeholder="Enter Password" name="psw" required>
        
      <button type="submit">Login</button>
      <label>
        <input type="checkbox" checked="checked" name="remember"> Remember me
      </label>
    </div>

    <div class="container" style="background-color:#f1f1f1">
      <button type="button" onclick="document.getElementById('id01').style.display='none'" class="cancelbtn">Cancel</button>
      <span class="psw">Forgot <a href="#">password?</a></span>
    </div>
  </form>
</div>

<script>

var modal = document.getElementById('id01');


window.onclick = function(event) {
    if (event.target == modal) {
        modal.style.display = "none";
    }
}
</script>

</body>
</html>
