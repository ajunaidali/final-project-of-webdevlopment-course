.logo{
    width: 160px;
    cursor: pointer;
    animation: movedown 1s linear 1;
    animation-delay: 1s;
    visibility: hidden;
    animation-fill-mode: forwards;
}
@keyframes movedown {
    0%{
        transform: translateY(-100px);
        visibility: visible;

    }
    100%{
        transform: translateY(0px);
        visibility: visible;

    }
}
.navbar{

nav{
